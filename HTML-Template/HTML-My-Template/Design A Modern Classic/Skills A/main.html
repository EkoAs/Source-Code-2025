<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Modern Classic Design</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
<style>
    /* --- CSS VARIABLES LOKAL (SKILLS) --- */
    #skills {
        --skills-bg: #ffffff;
        --skills-title: #111827;
        --card-bg: #f3f4f6; /* Abu sangat muda */
        --text-color: #374151;
        --bar-bg: #e5e7eb;
        --bar-fill: linear-gradient(90deg, #3b82f6, #2563eb); /* Gradasi Biru */
        --card-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    body.dark #skills {
        --skills-bg: #111827;
        --skills-title: #f9fafb;
        --card-bg: #1f2937; /* Abu gelap */
        --text-color: #d1d5db;
        --bar-bg: #374151;
        --bar-fill: linear-gradient(90deg, #60a5fa, #3b82f6);
        --card-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }

    /* --- LAYOUT --- */
    .skills-section {
        padding: 100px 5%;
        background-color: var(--skills-bg);
        transition: background-color 0.3s;
    }

    .skills-header {
        text-align: center;
        margin-bottom: 50px;
    }

    .skills-title {
        font-family: sans-serif;
        font-size: 2.5rem;
        font-weight: 800;
        color: var(--skills-title);
        margin-bottom: 10px;
    }

    /* --- GRID CONTAINER --- */
    .skills-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); /* Responsive otomatis */
        gap: 30px;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* --- KARTU SKILL --- */
    .skill-card {
        background-color: var(--card-bg);
        padding: 30px;
        border-radius: 16px;
        box-shadow: var(--card-shadow);
        transition: all 0.3s ease;
        border: 1px solid transparent;
    }

    .skill-card:hover {
        transform: translateY(-5px);
        border-color: rgba(59, 130, 246, 0.5); /* Border biru tipis saat hover */
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .category-title {
        font-family: sans-serif;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--skills-title);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* --- ITEM PROGRESS BAR --- */
    .skill-item {
        margin-bottom: 15px;
    }

    .skill-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
        font-family: sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-color);
    }

    .progress-bar {
        width: 100%;
        height: 10px;
        background-color: var(--bar-bg);
        border-radius: 10px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        background: var(--bar-fill);
        border-radius: 10px;
        width: 0%; /* Mulai dari 0 untuk animasi */
        animation: fillBar 1.5s ease-out forwards; /* Animasi jalan saat dimuat */
        position: relative;
    }
    
    /* Efek kilap pada bar */
    .progress-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        transform: translateX(-100%);
        animation: shimmer 2s infinite;
    }

    /* Animasi Keyframes */
    @keyframes fillBar {
        from { width: 0; }
    }
    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 600px) {
        .skills-grid {
            grid-template-columns: 1fr; /* 1 kolom di HP */
        }
    }
</style>

<section id="skills" class="skills-section">
    <div class="skills-header">
        <h2 class="skills-title">Keahlian & Tools</h2>
        <p style="color: #6b7280; font-family: sans-serif;">Teknologi yang saya gunakan sehari-hari</p>
    </div>

    <div class="skills-grid">
        
        <div class="skill-card">
            <h3 class="category-title">💻 Frontend Dev</h3>
            
            <div class="skill-item">
                <div class="skill-info">
                    <span>HTML & CSS</span>
                    <span>90%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 90%"></div>
                </div>
            </div>

            <div class="skill-item">
                <div class="skill-info">
                    <span>JavaScript</span>
                    <span>80%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 80%; animation-delay: 0.2s"></div>
                </div>
            </div>

            <div class="skill-item">
                <div class="skill-info">
                    <span>Tailwind CSS / Bootstrap</span>
                    <span>85%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 85%; animation-delay: 0.4s"></div>
                </div>
            </div>
        </div>

        <div class="skill-card">
            <h3 class="category-title">⚙️ Backend & Tools</h3>
            
            <div class="skill-item">
                <div class="skill-info">
                    <span>Python</span>
                    <span>75%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 75%; animation-delay: 0.1s"></div>
                </div>
            </div>

            <div class="skill-item">
                <div class="skill-info">
                    <span>MySQL / Database</span>
                    <span>70%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 70%; animation-delay: 0.3s"></div>
                </div>
            </div>

            <div class="skill-item">
                <div class="skill-info">
                    <span>Git & Github</span>
                    <span>80%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 80%; animation-delay: 0.5s"></div>
                </div>
            </div>
        </div>

        <div class="skill-card">
            <h3 class="category-title">🎨 Design & Soft Skills</h3>
            
            <div class="skill-item">
                <div class="skill-info">
                    <span>UI/UX Design (Figma)</span>
                    <span>65%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 65%; animation-delay: 0.2s"></div>
                </div>
            </div>

            <div class="skill-item">
                <div class="skill-info">
                    <span>Public Speaking</span>
                    <span>85%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 85%; animation-delay: 0.4s"></div>
                </div>
            </div>

            <div class="skill-item">
                <div class="skill-info">
                    <span>Teamwork</span>
                    <span>95%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 95%; animation-delay: 0.6s"></div>
                </div>
            </div>
        </div>

    </div>
</section>
        </body>
</html>
