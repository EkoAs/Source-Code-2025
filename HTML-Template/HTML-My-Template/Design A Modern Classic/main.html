<!DOCTYPE html>
< lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Modern Classic Design</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>


        <style>
    /* --- CSS VARIABLES (Agar mudah ganti warna & Mode Gelap) --- */
    :root {
        --nav-bg: rgba(240, 242, 245, 0.85); /* Putih keruh/Off-white */
        --nav-border: rgba(255, 255, 255, 0.4);
        --nav-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.5); /* Efek Metalik */
        --text-color: #333;
        --hover-bg: rgba(255, 255, 255, 0.6);
        --input-bg: rgba(220, 220, 220, 0.5);
        --mobile-menu-bg: rgba(245, 245, 245, 0.98);
    }

    /* Mode Gelap (Diaktifkan jika body/html punya class "dark") */
    .dark {
        --nav-bg: rgba(15, 23, 42, 0.85); /* Gelap transparan */
        --nav-border: rgba(255, 255, 255, 0.1);
        --nav-shadow: 0 4px 6px -1px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
        --text-color: #e2e8f0;
        --hover-bg: rgba(255, 255, 255, 0.1);
        --input-bg: rgba(30, 41, 59, 0.6);
        --mobile-menu-bg: rgba(15, 23, 42, 0.98);
    }

    /* --- UTAMA NAVBAR --- */
    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 70px;
        z-index: 1000;
        
        /* Glassmorphism & Metallic Effect */
        background-color: var(--nav-bg);
        backdrop-filter: blur(12px); /* Efek Blur */
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(0,0,0,0.05);
        box-shadow: var(--nav-shadow);
        
        transition: all 0.3s ease;
        display: flex;
        justify-content: center;
    }

    .nav-container {
        width: 100%;
        max-width: 1200px;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    /* --- BAGIAN KIRI (Logo & Menu) --- */
    .nav-left {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .nav-logo img {
        width: 40px;
        height: 40px;
        border-radius: 50%; /* Bulat */
        border: 2px solid rgba(150, 150, 150, 0.3);
        cursor: pointer;
        transition: transform 0.3s;
    }
    .nav-logo img:hover {
        transform: scale(1.1);
    }

    .nav-menu {
        display: flex;
        gap: 10px;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .nav-link {
        text-decoration: none;
        color: var(--text-color);
        font-family: sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 8px 16px;
        border-radius: 8px;
        transition: all 0.2s;
        border: 1px solid transparent;
    }

    .nav-link:hover {
        background-color: var(--hover-bg);
        border-color: var(--nav-border);
        transform: translateY(-1px);
    }
    
    .nav-link:active {
        transform: scale(0.95); /* Efek Tekan */
        background-color: rgba(0,0,0,0.1);
    }

    /* --- BAGIAN KANAN (Search & Toggle) --- */
    .nav-right {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .search-box {
        display: flex;
        align-items: center;
        background-color: var(--input-bg);
        padding: 5px 10px;
        border-radius: 50px; /* Oval */
        border: 1px solid transparent;
        transition: 0.3s;
    }
    
    .search-box:focus-within {
        border-color: #3b82f6;
        width: 220px; /* Memanjang saat diketik */
    }

    .search-input {
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-color);
        width: 120px;
        transition: width 0.3s;
        font-size: 0.9rem;
    }
    
    .search-box:focus-within .search-input {
        width: 180px;
    }

    .search-btn, .theme-toggle, .hamburger {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-color);
        font-size: 1.1rem;
        padding: 8px;
        border-radius: 50%;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .search-btn:hover, .theme-toggle:hover, .hamburger:hover {
        background-color: var(--hover-bg);
        transform: scale(1.1);
    }

    .search-btn:active, .theme-toggle:active {
        transform: scale(0.9);
    }

    /* --- RESPONSIVE (Mobile) --- */
    .hamburger {
        display: none; /* Hidden di desktop */
    }

    .mobile-menu {
        display: none; /* Hidden default */
        position: absolute;
        top: 70px;
        left: 0;
        width: 100%;
        background-color: var(--mobile-menu-bg);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(100,100,100,0.1);
        padding: 10px 0;
        flex-direction: column;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .mobile-menu.active {
        display: flex;
        animation: slideDown 0.3s ease-out;
    }

    .mobile-link {
        padding: 12px 20px;
        text-decoration: none;
        color: var(--text-color);
        font-family: sans-serif;
        font-weight: 600;
        border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .mobile-link:hover {
        background-color: var(--hover-bg);
        padding-left: 25px; /* Efek geser */
    }

    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Breakpoint untuk HP/Tablet Kecil */
    @media (max-width: 768px) {
        .nav-menu { display: none; } /* Sembunyikan menu desktop */
        .search-box { display: none; } /* Sembunyikan search desktop biar ringkas */
        .hamburger { display: flex; } /* Munculkan tombol hamburger */
    }
</style>

<nav class="navbar" id="navbar-a">
    <div class="nav-container">
        
        <div class="nav-left">
            <div class="nav-logo">
                <img src="https://via.placeholder.com/150" alt="Logo">
            </div>

            <ul class="nav-menu">
                <li><a href="#about" class="nav-link">About</a></li>
                <li><a href="#pendidikan" class="nav-link">Pendidikan</a></li>
                <li><a href="#projects" class="nav-link">Projects</a></li>
            </ul>
        </div>

        <div class="nav-right">
            
            <div class="search-box">
                <input type="text" id="searchInputCSS" class="search-input" placeholder="Cari...">
                <button class="search-btn" onclick="performSearchCSS()">
                    🔍
                </button>
            </div>

            <button class="theme-toggle" onclick="toggleTheme()">
                🌙
            </button>

            <button class="hamburger" onclick="toggleMobileMenuCSS()">
                ☰
            </button>
        </div>
    </div>

    <div id="mobile-menu-css" class="mobile-menu">
        <a href="#about" class="mobile-link" onclick="toggleMobileMenuCSS()">About</a>
        <a href="#pendidikan" class="mobile-link" onclick="toggleMobileMenuCSS()">Pendidikan</a>
        <a href="#projects" class="mobile-link" onclick="toggleMobileMenuCSS()">Projects</a>
        <div style="padding: 10px 20px; display:flex;">
            <input type="text" id="mobileSearchInput" placeholder="Cari..." 
                   style="padding: 8px; border-radius: 4px; border:1px solid #ccc; width:100%;">
            <button onclick="performSearchMobile()" style="padding: 8px; margin-left:5px;">🔍</button>
        </div>
    </div>
</nav>

<script>
    // 1. Toggle Mobile Menu
    function toggleMobileMenuCSS() {
        const menu = document.getElementById('mobile-menu-css');
        menu.classList.toggle('active');
    }

    // 2. Toggle Dark Mode (Manual CSS Class)
    function toggleTheme() {
        document.body.classList.toggle('dark');
        // Opsional: Simpan preferensi user
        // localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }

    // 3. Fungsi Search Sederhana
    function performSearchCSS() {
        const query = document.getElementById('searchInputCSS').value;
        if(query) {
            const found = window.find(query);
            if(!found) alert("Kata '" + query + "' tidak ditemukan.");
        }
    }
    
    function performSearchMobile() {
        const query = document.getElementById('mobileSearchInput').value;
        if(query) {
            const found = window.find(query);
            toggleMobileMenuCSS(); // Tutup menu setelah cari
            if(!found) alert("Kata '" + query + "' tidak ditemukan.");
        }
    }
</script>




    </body>
</html>
