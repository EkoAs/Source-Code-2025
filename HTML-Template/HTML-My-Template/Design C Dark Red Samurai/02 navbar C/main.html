<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Modern Classic Design</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
    <style>
    /* --- CSS VARIABLES (Tema C) --- */
    :root {
        --bg-c: #000000;         /* Hitam Mati */
        --accent-c: #ff003c;     /* Merah Neon/Crimson */
        --text-c: #ffffff;
        --gray-c: #1a1a1a;
        --font-c: sans-serif;    /* Bisa diganti font gaming kayak 'Rajdhani' */
    }

    /* --- UTAMA --- */
    .navbar-c {
        position: fixed;
        top: 0; left: 0; width: 100%;
        height: 80px;
        background-color: var(--bg-c);
        border-bottom: 3px solid var(--accent-c); /* Garis Merah Tegas di Bawah */
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 5px 20px rgba(255, 0, 60, 0.15); /* Glow Merah Tipis */
    }

    /* Pattern Garis Miring di Background (Opsional, biar sporty) */
    .navbar-c::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: repeating-linear-gradient(
            45deg,
            transparent,
            transparent 10px,
            rgba(255, 255, 255, 0.03) 10px,
            rgba(255, 255, 255, 0.03) 20px
        );
        pointer-events: none;
    }

    .nav-c-container {
        width: 100%;
        max-width: 1200px;
        padding: 0 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        z-index: 1;
    }

    /* --- LOGO (Kiri) --- */
    .logo-c {
        font-size: 1.8rem;
        font-weight: 900;
        font-style: italic; /* Miring biar kenceng */
        color: var(--text-c);
        text-transform: uppercase;
        letter-spacing: -1px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    /* Titik Merah Kotak */
    .logo-dot {
        width: 12px;
        height: 12px;
        background-color: var(--accent-c);
        transform: skewX(-20deg); /* Miring */
    }

    /* --- MENU (Tengah) --- */
    .menu-c {
        display: flex;
        gap: 5px;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .link-c {
        position: relative;
        text-decoration: none;
        color: #888;
        font-weight: 700;
        font-size: 0.9rem;
        text-transform: uppercase;
        padding: 10px 25px;
        transition: color 0.3s;
        overflow: hidden; /* Biar background miring gak keluar */
    }

    /* Background Slash Effect */
    .link-c::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: var(--accent-c);
        transform: skewX(-20deg) translateX(-150%); /* Mulai dari luar kiri */
        transition: transform 0.3s ease-out;
        z-index: -1;
    }

    .link-c:hover {
        color: #fff;
    }

    /* Saat hover, background merah menyapu dari kiri */
    .link-c:hover::before {
        transform: skewX(-20deg) translateX(0);
    }

    /* --- KANAN (Search & Tools) --- */
    .tools-c {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    /* Tombol Search Bulat -> Kotak di C */
    .btn-icon-c {
        background: none;
        border: 1px solid #333;
        color: var(--text-c);
        width: 40px; height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s;
        transform: skewX(-10deg); /* Miring */
    }

    .btn-icon-c:hover {
        background-color: var(--accent-c);
        border-color: var(--accent-c);
        box-shadow: 0 0 10px var(--accent-c);
    }

    .icon-normal {
        transform: skewX(10deg); /* Balikin icon biar tegak */
        font-size: 1.1rem;
    }

    /* INPUT SEARCH (Hidden by default, muncul overlay) */
    .search-overlay {
        position: absolute;
        top: 80px; /* Tepat di bawah navbar */
        left: 0;
        width: 100%;
        background-color: var(--accent-c);
        padding: 15px;
        transform: scaleY(0); /* Terlipat */
        transform-origin: top;
        transition: transform 0.3s ease;
        display: flex;
        justify-content: center;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .search-overlay.active {
        transform: scaleY(1); /* Terbuka */
    }

    .input-c {
        width: 100%;
        max-width: 600px;
        background: rgba(0,0,0,0.3);
        border: none;
        color: #fff;
        padding: 10px 20px;
        font-size: 1.1rem;
        outline: none;
        font-weight: bold;
        border-left: 5px solid #fff;
    }
    .input-c::placeholder { color: rgba(255,255,255,0.7); }

    /* --- MOBILE --- */
    .hamburger-c {
        display: none;
        flex-direction: column;
        gap: 6px;
        cursor: pointer;
    }
    .bar-c {
        width: 30px; height: 3px;
        background-color: var(--text-c);
        transition: 0.3s;
    }
    .hamburger-c:hover .bar-c {
        background-color: var(--accent-c);
    }

    /* Mobile Menu Overlay (Full Screen Hitam) */
    .mobile-menu-c {
        position: fixed;
        top: 80px; left: 0; width: 100%; height: 0;
        background-color: rgba(0,0,0,0.95);
        overflow: hidden;
        transition: height 0.4s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 900;
    }
    
    .mobile-menu-c.active {
        height: calc(100vh - 80px);
    }

    .mobile-link-c {
        font-size: 2rem;
        font-weight: 900;
        color: #fff;
        text-decoration: none;
        text-transform: uppercase;
        margin: 15px 0;
        font-style: italic;
        position: relative;
        transition: 0.3s;
    }
    
    .mobile-link-c:hover {
        color: var(--accent-c);
        letter-spacing: 5px; /* Efek melebar */
    }

    @media (max-width: 768px) {
        .menu-c { display: none; }
        .hamburger-c { display: flex; }
    }
</style>

<nav id="navbar-c" class="navbar-c">
    <div class="nav-c-container">
        
        <div class="logo-c">
            <div class="logo-dot"></div>
            SAMURAI<span style="color: var(--accent-c);">DEV</span>
        </div>

        <ul class="menu-c">
            <li><a href="#about" class="link-c">About</a></li>
            <li><a href="#pendidikan" class="link-c">Education</a></li>
            <li><a href="#skills" class="link-c">Skills</a></li>
            <li><a href="#projects" class="link-c">Projects</a></li>
            <li><a href="#contact" class="link-c">Contact</a></li>
        </ul>

        <div class="tools-c">
            <button class="btn-icon-c" onclick="toggleSearchC()">
                <span class="icon-normal">🔍</span>
            </button>

            <div class="hamburger-c" onclick="toggleMobileC()">
                <div class="bar-c"></div>
                <div class="bar-c"></div>
                <div class="bar-c"></div>
            </div>
        </div>
    </div>

    <div id="searchPanelC" class="search-overlay">
        <input type="text" id="searchC" class="input-c" placeholder="COMMAND: SEARCH_KEYWORD...">
        <button onclick="performSearchC()" style="background:black; color:white; border:none; padding:0 20px; font-weight:bold; cursor:pointer;">GO</button>
    </div>

    <div id="mobileMenuC" class="mobile-menu-c">
        <a href="#about" class="mobile-link-c" onclick="toggleMobileC()">About</a>
        <a href="#pendidikan" class="mobile-link-c" onclick="toggleMobileC()">Education</a>
        <a href="#skills" class="mobile-link-c" onclick="toggleMobileC()">Skills</a>
        <a href="#projects" class="mobile-link-c" onclick="toggleMobileC()">Projects</a>
        <a href="#contact" class="mobile-link-c" onclick="toggleMobileC()">Contact</a>
    </div>
</nav>

<script>
    // 1. Toggle Search Panel
    function toggleSearchC() {
        const panel = document.getElementById('searchPanelC');
        panel.classList.toggle('active');
        if(panel.classList.contains('active')) {
            document.getElementById('searchC').focus();
        }
    }

    // 2. Perform Search
    function performSearchC() {
        const query = document.getElementById('searchC').value;
        if(query) {
            // Tutup panel dulu biar rapi
            document.getElementById('searchPanelC').classList.remove('active');
            
            const found = window.find(query);
            if(!found) alert("TARGET NOT FOUND: " + query);
        }
    }

    // Enter key trigger
    document.getElementById('searchC').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            performSearchC();
        }
    });

    // 3. Toggle Mobile Menu
    function toggleMobileC() {
        const menu = document.getElementById('mobileMenuC');
        menu.classList.toggle('active');
        
        // Animasi Hamburger jadi X (Optional logic simple)
        const bars = document.querySelectorAll('.bar-c');
        if(menu.classList.contains('active')){
            bars[1].style.opacity = 0;
            bars[0].style.transform = "rotate(45deg) translate(5px, 6px)";
            bars[2].style.transform = "rotate(-45deg) translate(5px, -6px)";
        } else {
            bars[1].style.opacity = 1;
            bars[0].style.transform = "none";
            bars[2].style.transform = "none";
        }
    }
</script>
    </body>
</html>
