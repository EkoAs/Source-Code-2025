<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Modern Classic Design</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
    <style>
    /* --- VARIABLES (CONTACT D) --- */
    #contact {
        --bg-d: #050505;
        --bronze-main: #CD7F32;
        --bronze-light: #F4A460;
        --text-gray: #666;
        --text-light: #e0e0e0;
        --font-serif: 'Playfair Display', serif;
        --font-sans: 'Inter', sans-serif;
    }

    /* --- LAYOUT CONTACT --- */
    .contact-d-section {
        position: relative;
        padding: 150px 5% 100px 5%;
        background-color: var(--bg-d);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .con-d-container {
        width: 100%;
        max-width: 800px;
        text-align: center;
        z-index: 2;
    }

    /* TYPOGRAPHY */
    .con-d-pre {
        font-family: var(--font-sans);
        font-size: 0.9rem;
        color: var(--bronze-main);
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 20px;
        display: block;
    }

    .con-d-title {
        font-family: var(--font-serif);
        font-size: 4rem;
        font-weight: 400;
        font-style: italic;
        color: var(--text-light);
        margin-bottom: 60px;
        line-height: 1.2;
    }

    /* --- FORMULIR (NO BOX, JUST LINES) --- */
    .form-d-minimal {
        width: 100%;
        margin-top: 50px;
    }

    .input-group-d {
        position: relative;
        margin-bottom: 50px;
    }

    .input-d-line {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid #333; /* Garis abu gelap */
        padding: 15px 0;
        font-family: var(--font-serif);
        font-size: 1.5rem;
        color: var(--bronze-light);
        transition: 0.5s;
    }

    .input-d-line:focus {
        outline: none;
        border-bottom-color: var(--bronze-main);
    }

    /* Label Floating */
    .label-d {
        position: absolute;
        top: 0; left: 0;
        font-family: var(--font-sans);
        font-size: 0.8rem;
        color: var(--text-gray);
        text-transform: uppercase;
        letter-spacing: 2px;
        pointer-events: none;
        transition: 0.5s;
    }

    /* Animasi Label saat input di-klik/isi */
    .input-d-line:focus ~ .label-d,
    .input-d-line:valid ~ .label-d {
        top: -25px;
        font-size: 0.7rem;
        color: var(--bronze-main);
    }

    /* TOMBOL KIRIM (Teks Besar) */
    .btn-d-send {
        background: none;
        border: none;
        font-family: var(--font-sans);
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text-light);
        text-transform: uppercase;
        letter-spacing: 3px;
        cursor: pointer;
        padding: 20px 40px;
        border: 1px solid rgba(205, 127, 50, 0.3);
        transition: 0.4s;
        margin-top: 30px;
    }

    .btn-d-send:hover {
        background-color: var(--bronze-main);
        border-color: var(--bronze-main);
        color: #000;
    }

    /* --- FOOTER D (FREE FLOW) --- */
    .footer-d {
        position: relative;
        padding: 100px 5% 50px 5%;
        background-color: var(--bg-d);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-end;
    }

    /* COPYRIGHT (Kiri Bawah) */
    .footer-copy {
        font-family: var(--font-sans);
        color: #444;
        font-size: 0.8rem;
        max-width: 300px;
        line-height: 1.6;
    }

    /* SOCIAL ICONS (LOGOS) - Posisi Bebas / Kanan */
    .social-gallery {
        display: flex;
        gap: 30px;
        align-items: center;
    }

    /* Style untuk Logo SVG/Gambar */
    .social-icon-img {
        width: 30px; 
        height: 30px;
        fill: #666; /* Warna dasar abu */
        transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
    }

    /* Efek Hover: Membesar & Berubah Warna Emas */
    .social-icon-img:hover {
        fill: var(--bronze-light);
        transform: scale(1.5) rotate(5deg);
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
        .con-d-title { font-size: 2.5rem; }
        .footer-d { flex-direction: column; align-items: center; gap: 50px; text-align: center; }
    }
</style>

<section id="contact" class="contact-d-section">
    <div class="con-d-container">
        <span class="con-d-pre">Inquiries</span>
        <h2 class="con-d-title">
            Interested in collaboration? <br>
            Let’s create something timeless.
        </h2>

        <form class="form-d-minimal" onsubmit="kirimPesanD(event)">
            
            <div class="input-group-d">
                <input type="text" class="input-d-line" required>
                <label class="label-d">Your Name</label>
            </div>

            <div class="input-group-d">
                <input type="email" class="input-d-line" required>
                <label class="label-d">Email Address</label>
            </div>

            <div class="input-group-d">
                <input type="text" class="input-d-line" required>
                <label class="label-d">Tell me about your project</label>
            </div>

            <button type="submit" class="btn-d-send">Send Request</button>
        </form>
    </div>
</section>

<footer class="footer-d">
    
    <div class="footer-copy">
        &copy; 2025 Alexandria Portfolio.<br>
        Designed with precision and passion.<br>
        Based in Jakarta, available worldwide.
    </div>

        <a href="#" title="LinkedIn">

    </div>
</footer>

<script>
    function kirimPesanD(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const originalText = btn.innerText;
        
        btn.innerText = "Sending...";
        btn.style.borderColor = "#fff";
        
        setTimeout(() => {
            alert("Thank you. Your message has been received.");
            btn.innerText = "Message Sent";
            btn.style.backgroundColor = "#CD7F32";
            btn.style.color = "black";
            e.target.reset();
            setTimeout(() => { 
                btn.innerText = originalText; 
                btn.style.backgroundColor = "transparent";
                btn.style.color = "#e0e0e0";
            }, 3000);
        }, 1500);
    }
</script>
    </body>
</html>
