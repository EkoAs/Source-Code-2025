<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Modern Classic Design</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
    <style>
    /* --- VARIABLES (TEMA E) --- */
    #contact-e {
        --bg-deep: #000000;
        --platinum: #e5e4e2;
        --border-shine: rgba(255, 255, 255, 0.2);
        --font-formal: 'Montserrat', sans-serif;
    }

    /* --- LAYOUT --- */
    .contact-e-section {
        padding: 100px 5% 50px 5%;
        background-color: var(--bg-deep);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Wadah Formulir (The Envelope) */
    .prism-envelope {
        width: 100%;
        max-width: 700px;
        padding: 60px;
        border: 1px solid var(--border-shine);
        background: rgba(10, 10, 10, 0.6);
        backdrop-filter: blur(10px);
        position: relative;
        text-align: center;
        /* Hiasan sudut Diamond */
        clip-path: polygon(
            30px 0, 100% 0, 
            100% calc(100% - 30px), calc(100% - 30px) 100%, 
            0 100%, 0 30px
        );
        box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        margin-bottom: 80px;
    }

    /* Efek Kilau Pinggir Amplop */
    .prism-envelope::before {
        content: '';
        position: absolute;
        inset: 0;
        border: 1px solid rgba(255,255,255,0.05);
        clip-path: polygon(30px 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%, 0 30px);
        pointer-events: none;
    }

    /* Diamond Seal (Logo Kecil di Atas Form) */
    .diamond-seal {
        width: 40px; height: 40px;
        background: #fff;
        margin: 0 auto 40px auto;
        transform: rotate(45deg);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    .diamond-seal-inner {
        width: 80%; height: 80%;
        border: 1px solid #000;
    }

    /* JUDUL MENGKILAP */
    .con-e-title {
        font-family: var(--font-formal);
        font-size: 2.5rem;
        font-weight: 300;
        text-transform: uppercase;
        letter-spacing: 4px;
        margin-bottom: 50px;
        
        /* Gradient Animation */
        background: linear-gradient(90deg, #666, #fff, #888, #fff, #666);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shineFlow 6s linear infinite;
    }

    /* FORM INPUTS */
    .form-group-e {
        margin-bottom: 40px;
        position: relative;
    }

    .input-prism {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid #333;
        padding: 15px 0;
        font-family: var(--font-formal);
        font-size: 1rem;
        color: #fff;
        text-align: center;
        letter-spacing: 2px;
        transition: 0.5s;
    }

    .input-prism:focus {
        outline: none;
        border-bottom-color: #fff;
        background: linear-gradient(to top, rgba(255,255,255,0.05), transparent);
    }

    .input-prism::placeholder {
        color: #555;
        text-transform: uppercase;
        font-size: 0.8rem;
    }

    /* TOMBOL KIRIM */
    .btn-prism-send {
        margin-top: 20px;
        background: transparent;
        border: 1px solid rgba(255,255,255,0.3);
        color: #fff;
        padding: 15px 50px;
        font-family: var(--font-formal);
        text-transform: uppercase;
        letter-spacing: 3px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: 0.4s;
        position: relative;
        overflow: hidden;
    }

    .btn-prism-send:hover {
        border-color: #fff;
        background: #fff;
        color: #000;
        box-shadow: 0 0 30px rgba(255,255,255,0.4);
    }

    /* --- FOOTER E --- */
    .footer-e {
        width: 100%;
        border-top: 1px solid rgba(255,255,255,0.05);
        padding-top: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
    }

    /* SOCIAL LOGOS (DIAMOND SHAPE) */
    .social-diamond-grid {
        display: flex;
        gap: 30px;
    }

    .social-diamond {
        width: 50px; height: 50px;
        border: 1px solid rgba(255,255,255,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: rotate(45deg); /* Putar kotak jadi diamond */
        transition: 0.4s;
        text-decoration: none;
    }

    .social-icon-svg {
        width: 20px; height: 20px;
        fill: #aaa;
        transform: rotate(-45deg); /* Putar balik icon biar lurus */
        transition: 0.4s;
    }

    /* Hover Effect Social */
    .social-diamond:hover {
        background: #fff;
        border-color: #fff;
        box-shadow: 0 0 20px rgba(255,255,255,0.6);
        transform: rotate(45deg) scale(1.1);
    }

    .social-diamond:hover .social-icon-svg {
        fill: #000; /* Icon jadi hitam saat background putih */
    }

    /* COPYRIGHT */
    .footer-copy-e {
        font-family: var(--font-formal);
        color: #444;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    @media (max-width: 768px) {
        .prism-envelope { padding: 40px 20px; }
        .con-e-title { font-size: 1.8rem; }
    }
</style>

<section id="contact" class="contact-e-section">
    
    <div class="prism-envelope">
        <div class="diamond-seal">
            <div class="diamond-seal-inner"></div>
        </div>

        <h2 class="con-e-title">Inquire</h2>

        <form onsubmit="kirimPesanE(event)">
            <div class="form-group-e">
                <input type="text" class="input-prism" placeholder="Your Name" required>
            </div>
            <div class="form-group-e">
                <input type="email" class="input-prism" placeholder="Email Address" required>
            </div>
            <div class="form-group-e">
                <input type="text" class="input-prism" placeholder="Subject / Message" required>
            </div>

            <button type="submit" class="btn-prism-send">Send Request</button>
        </form>
    </div>

            <a href="#" class="social-diamond">

        <div class="footer-copy-e">

        </div>
    </footer>
</section>

<script>
    function kirimPesanE(e) {
        e.preventDefault();
        const btn = document.querySelector('.btn-prism-send');
        const originalText = btn.innerText;
        
        btn.innerText = "Request Sent";
        btn.style.background = "#fff";
        btn.style.color = "#000";

        setTimeout(() => {
            alert("Inquiry Received. We will contact you shortly.");
            e.target.reset();
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "transparent";
                btn.style.color = "#fff";
            }, 2000);
        }, 1000);
    }
</script>
    </body>
</html>
