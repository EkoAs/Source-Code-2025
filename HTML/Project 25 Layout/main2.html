<!DOCTYPE html>
<html lang="en-id">
<head>
    <title>tesst</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
        }
        .container {
            display: grid;
            grid-template-rows: 200px 1fr;
            grid-template-columns: 1fr 2fr;
            height: 100vh;
        }
        .header {
            grid-column: 1 / span 2;
            height: 100%;
            border-bottom: 1px solid #ccc;
        }
        .menu {
            border-right: 1px solid #ccc;
            height: 100%;
        }
        .main {
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <iframe src="header.html" title="Header"></iframe>
        </div>
        <div class="menu">
            <iframe src="menu.html" title="Menu"></iframe>
        </div>
        <div class="main">
            <iframe src="bodymain.html" title="Main"></iframe>
        </div>
    </div>
</body>
</html>
