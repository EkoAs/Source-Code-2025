            <style>
                .navbar{
                clear: both;
                z-index: 999;
                display: block;
                width: 100%;
                background-color: rgba(51, 51, 51, 0.897);
                backdrop-filter: blur(5px);

            @media (max-width: 600px){

            .navbar-navigator ul{

            .navbar-navigator a{

                color: rgb(235, 225, 225);
                text-align: center;
                padding: 6px 8px;
                text-decoration: none;
                justify-content: center;
                align-items: center;

        <body>  
            <div class="navbar" id="Home">
                <div class="navbar-profille">
                    <img src="../img/profille.jpeg" alt="logo" width="50" height="auto">
                </div>
                <div class="navbar-navigator">
                    <ul>
                        <li><a href="#Home">Home</a></li>
                        <li><a href="#About">About</a></li>
                        <li><a href="Archi">More</a></li>
                        <li><a href="phone">Other</a></li>
                        <button class="dark-mode-toggle" onclick="toggleDarkMode()">Toggle Dark Mode</button>
                        </li>
                    </ul></div> </div>

                    <!-- kontrel dark mode -->
                <style>
                body {
                  margin: 0;
                  font-family: Arial, sans-serif;
                  transition: background-color 0.3s, color 0.3s;
                }
                body.light-mode {
                  background-color: #ffffff;
                  color: #000000;
                }
                body.dark-mode {
                  background-color: #121212;
                  color: #ffffff;
                }
                .dark-mode-toggle {
                  position: fixed;
                  top: 10px;
                  right: 10px;
                  padding: 10px 15px;
                  cursor: pointer;
                  border: none;
                  background-color:urururut #007bff;
                  color: #ffffff;
                  border-radius: 5px;
                  transition: background-color 0.3s;
                  border-radius: 17px;
                }
                .dark-mode-toggle:hover {
                  background-color: #0056b3;
                }
              </style>              
            <script>
               
                const currentMode = localStorage.getItem('theme') || 'light-mode';
                document.body.className = currentMode;
              
                function toggleDarkMode() {
                  const body = document.body;
                  const newMode = body.classList.contains('light-mode') ? 'dark-mode' : 'light-mode';

                  body.className = newMode;
                
                  localStorage.setItem('theme', newMode);}
              </script>
              <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
              <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
