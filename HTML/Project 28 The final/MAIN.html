        <style>
                body {
                  margin: 0;
                  font-family: Arial, sans-serif;
                  transition: background-color 0.3s, color 0.3s;
                }
                body.light-mode {
                  background-color: #ffffff;
                  color: #000000;
                }
                body.dark-mode {
                  background-color: #121212;
                  color: #ffffff;
                }
                .dark-mode-toggle {
                  position: fixed;
                  top: 10px;
                  right: 10px;
                  padding: 10px 15px;
                  cursor: pointer;
                  border: none;
                  background-color:urururut #007bff;
                  color: #ffffff;
                  border-radius: 5px;
                  transition: background-color 0.3s;
                  border-radius: 17px;
                }
                .dark-mode-toggle:hover {
                  background-color: #0056b3;
                }
              </style>              
            <script>
               
                const currentMode = localStorage.getItem('theme') || 'light-mode';
                document.body.className = currentMode;
              
                function toggleDarkMode() {
                  const body = document.body;
                  const newMode = body.classList.contains('light-mode') ? 'dark-mode' : 'light-mode';
                  // Ubah class body
                  body.className = newMode;
                  // Simpan mode ke localStorage
                  localStorage.setItem('theme', newMode);}
              </script>
              <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
