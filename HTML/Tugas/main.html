<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perhitungan Nilai Akhir</title>
    <script src="main.js" defer></script>
</head>
<body>
    <style>
        label{
            display: inline-block;
            width: 100px;
            margin-bottom: 10px;
            
    
        }</style>
    <h1>Perhitungan Nilai Akhir</h1>
    <label for="nama">Nama:</label>
    <input type="text" id="nama" placeholder="Masukkan nama">
    <br><br>

    
    <label for="nilaiUts">Nilai UTS:</label>
    <input type="number" id="nilaiUts" placeholder="Masukkan nilai UTS">
    <br><br>

    
    <label for="nilaiUas">Nilai UAS:</label>
    <input type="number" id="nilaiUas" placeholder="Masukkan nilai UAS">
    <br><br>

    <label for="nilaiMandiri">Nilai Mandiri:</label>
    <input type="number" id="nilaiMandiri" placeholder="Masukkan nilai Mandiri">
    <br><br>

    
    <button onclick="user_input()">Hitung</button>

    
    <h2>Hasil:</h2>
    <div id="hasil"></div>
</body>
</html>
