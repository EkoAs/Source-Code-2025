<!DOCTYPE html>
    <html>
        <head>
            <title> MediaApi Login </title>
            <meta name="viewport" content="width=device-width,initial-scale=1">
        </head>
        <body>
            <form action="#" name="" method="get" enctype="#">
            <fieldset>
                <legend>Pendaftaran</legend>
                <h4> Tambah Anggota</h4>
                <p>
                    <label id="Name">Name :</label>
                    <input type="text" name="Name" id="Name" required>
                </p>
                <p>
                    <label id="Tempat lahir">Tempat lahir :</label>
                    <input type="text" name="Tempat lahir" id="Tempat lahir" required>
                    <label id="tanggal lahir"> Tanggal lahir :</label>
                    <input type="date" name="tanggal lahir" id="tanggal lahir" required>

                </p><p>
                <p>
                    <label id="Alamat">Alamat :</label> 
                </p>
                <p>
                    <textarea name="Alamat" id="Alamat" style="width:200px; height: 80px;" required></textarea>
                    
                </p>
                <p>
                    <label>Kota :</label>
                    <input type="text" name="Kota"></p>
                <p>
                    <label>Negara :</label>
                    <input type="text" name="Negara"></p>
                <p>
                    <label>Kode pos :</label>
                    <input type="number" name="Kode pos"></p><br>
                

                <p> 
                    <label>No. Hp:</label>
                    <input type="number" name="no hp"></p> 
                <p> 
                    <label>email:</label>
                    <input type="email" name="email"></p> 
                <p> 
                    <label>Tinggi badan:</label>
                    <input type="number" name="tinggi badan"></p> 
                <p> 
                    <label>berat badan:</label>
                    <input type="number" name="berat badan"></p> 
                

                <p>
                    <input type="submit" name="submit" value="Send">
                </p>

            </fieldset>
            </form>

        </body>
    </html>
