<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="main.js" defer></script>
</head>
<body>
    <button onclick="loopingFor()">for Loop</button>
    <button onclick="loopingWhile()">while Loop</button>
    <button onclick="loopingDoWhile()">do...while Loop</button>
    <button onclick="hitung_Genap()">Hitung Genap</button>

    <script>
        

function hitung_Genap(){
    var num = 0
    for(let i=1;i<=20;++i){
        if(i % 2 == 0){
            num += i;
        } else{
            continue;
        }
        console.log(`Loop ke ${i}`)
    }
    console.log(`Jumlah bilangan genap dari 1 sampai 110 adalah ${num}`);
}


function prima(){
    var num = 0
    for(let i=2;i<=20;++i){
        if(i % 2 != 0){
            num += i;
        } else{
            continue;
        }
        console.log(`Loop ke ${i}`)
    }
   
}
hitung_Genap();    
prima();
    </script>

</body>
</html>
