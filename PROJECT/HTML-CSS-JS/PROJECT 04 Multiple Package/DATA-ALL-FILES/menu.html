<!DOCTYPE HTML>
<html lang="id">
    <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Menu</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* ⛔️ Hilang semua scroll */
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            background-color: #060606;
            }
        .SUPER-MAINBOARD-TWO{
            display: flex;
            position: relative;
            flex-wrap: wrap;
            padding: 0;
            margin: 0;
            width: 100%;
            background: transparent;
            border-collapse: collapse;
            border-spacing: 0;
            padding-top: 62px;
            text-align: center;
            justify-content: space-between;
            box-sizing: border-box;
            border: solid 3px red;
        }


        .SUPER-MAINBOARD-TWO .SUPER-TWO{
            height: max-content;
            width: 100%;
            justify-items: center;
            padding-top: 0px;
            display: flex;
            flex-wrap: wrap;
            box-sizing: border-box;
            border-collapse: 1;
            margin: 0;
            padding-top: 0;
            align-items:center;
            justify-content: center;
            border: solid 3px red;
        }

        .SUPER-MAINBOARD-TWO .SUPER-TWO .main-control{
            width: 220px;
            height: 40px;
            padding: 0;
            background: linear-gradient(135deg, rgba(23, 124, 255, 0.486), rgba(53, 16, 185, 0.493));
            backdrop-filter: blur(10px); /* efek blur di belakang */
            -webkit-backdrop-filter: blur(10px); /* buat Safari */
            border: 1px solid rgba(255, 255, 255, 0.3); /* biar keliatan glossy */
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); /* efek mengkilap lembut */
            color: white;
            background-image:
            linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 30%),
            linear-gradient(135deg, rgba(29,97,185,0.7), rgba(38,124,96,0.7));
            overflow: hidden; 
            font-size: 19px;
            margin-top: 10px;
            
        }
        .SUPER-MAINBOARD-TWO .SUPER-TWO .main-control::before {
        content: "";
        position: absolute;
        top: 0;
        left: -75%;
        width: 50%;
        height: 100%;
        background: linear-gradient(
            120deg,
            transparent,
            rgba(255, 255, 255, 0.6),
            transparent
        );
        animation: shine 2s infinite;
        }

        @keyframes shine {
        0% { left: -75%; }
        100% { left: 125%; }
        }

        .SUPER-MAINBOARD-TWO .SUPER-TWO .main-control a{
            text-decoration: none;
        }

        *{
            color:whitesmoke;
        }

</style>
</head>
<body style="margin:0; padding:10px; width:100%;">

   <div class="SUPER-MAINBOARD-TWO">
              <div class="SUPER-TWO">
                <h3>What're you Looking for?</h3><br>
                <button class="main-control"><a href="home.html" target="main-content">Home</a></button>
                <button class="main-control"><a href="about.html" target="main-content">About me</a></button>
                <button class="main-control"><a href="MY-SKILLS\index.html" target="main-content">Skills</a></button>
                <button class="main-control"><a href="sertifikat.html" target="main-content">Sertifikasi</a></button>
                <button class="main-control"><a href="#">Follow Me On</a></button>
              </div>

    
    
</body>
</html>
