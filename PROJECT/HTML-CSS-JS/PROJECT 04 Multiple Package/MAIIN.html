<!DOCTYPE html>
<html lang="en-id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyek Web dengan Iframe</title>
    <link rel="stylesheet" href="Style/main.css">
    <script>
function resizeIframe(iframe) {
  if (iframe && iframe.contentWindow && iframe.contentWindow.document.body) {
    iframe.style.height = iframe.contentWindow.document.body.scrollHeight + 'px';
  }
}

window.addEventListener('load', function () {
  const header = document.querySelector('.header');
  const sidebar = document.querySelector('.sidebar');
  const mainIframe = document.querySelector('.main-content iframe');
  const footer = document.querySelector('.footer');

  [header, sidebar, mainIframe, footer].forEach(el => {
    resizeIframe(el);
    el.addEventListener('load', () => resizeIframe(el));
  });
});
</script>

   <style>
    body, html {
        margin: 0;
        padding: 0;
        height: auto; /* Ubah dari height: 100% agar body bisa scroll jika konten lebih tinggi */
        font-family: Arial, sans-serif;
        overflow-y: auto; /* Pastikan body bisa scroll vertikal */
        background: transparent !important;
       
    }

    .container {
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: 1fr; /* Single column layout */
        min-height: 100vh; 
        min-height: calc(100vh - 140px);
        margin-bottom: 200px;
    }
    
    .header, .footer {
        width: 100%;
        border: none;
        overflow: hidden;
        display: flex;
    }
   .footer{
    margin-top: 200px;
    z-index: 20; 
    position: relative;
   }

    .content {
        display:flex;
        overflow: auto;
        grid-row: 2 / 3;
        display: grid;
        grid-template-columns: 1fr 3fr; /* Sidebar 1 bagian, Main Content 3 bagian */

    }
    .sidebar iframe {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        border: none;
        overflow: hidden; /* Tambahan untuk memastikan iframe internal tidak scroll */
    }

   
     .sidebar {
        width: 100%;
        border: none;
        overflow: auto;
        scrollbar-width: none; 
        -ms-overflow-style: none; /* IE/Edge */
    }
    .sidebar::-webkit-scrollbar {
        display: none; 
    }

    .main-content iframe {
        width: 100%;
        /* Hapus height: 100%; agar tinggi menyesuaikan konten */
        border: none;
    }
</style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <iframe class="header" src="DATA-ALL-FILES/header.html"></iframe>

        <!-- Content -->
        <div class="content">
            <!-- Sidebar -->
            <iframe class="sidebar" src="menu.html"></iframe>

            <!-- Main Content -->
            <div class="main-content">
                <iframe name="main-content" src="DATA-ALL-FILES/home.html"></iframe>
            </div>
        </div>

        <!-- Footer -->
        <iframe class="footer" src="DATA-ALL-FILES/FOOTER/index.html"></iframe>
    </div>
</body>
</html>
