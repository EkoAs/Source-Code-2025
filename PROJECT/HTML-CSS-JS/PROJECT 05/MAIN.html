<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout SUPER-DIV (Fungsional JS)</title>
    
    <style>
        /* CSS yang sudah Anda berikan */
        html, body {
            margin: 0;
            padding: 0;
        }
        
        body, h1, h2, h3, p, ul { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .SUPER-DIV { 
            width: 100%; 
            padding: 0;
            margin: 0;
            display: flex; 
            flex-direction: column; 
            flex-wrap: wrap; 
            }

        .DIV-HEADER, .DIV-FOOTER { 
            width: 100%; 
            background-color: #f0f0f0; 
            text-align: center; 
            border-bottom: 1px solid #ccc; 
            overflow: visible;
            flex-shrink: 0;}
            

        .DIV-FOOTER { 
            border-top: 1px solid #ccc; 
            border-bottom: none; 
            overflow: visible;}
        .DIV-MAIN { 
            width: 100%; 
            display: flex; 
            flex-direction: row; 
            min-height: auto; 
            box-sizing: border-box; 
            display: flex;
            position: relative;
            overflow-y: visible;}

        .DIV-SIDEBAR { 
            width: 30%; 
            padding: 20px; 
            box-sizing: border-box; 
            border-right: 1px solid #ccc; 

            background: linear-gradient(
            to bottom, 
            #2a364a 0%,   
            #10182f 50%,   
            #0a101d 100%);
    

        box-shadow: 
            inset 0 1px 0 rgba(255, 255, 255, 0.1), 
            inset 0 -1px 0 rgba(0, 0, 0, 0.5),     
            0 4px 10px rgba(0, 0, 0, 0.5);
            
        
        }
        .DIV-SIDEBAR ul { 
            list-style: none; 
            margin-top: 10px; }
        .DIV-SIDEBAR li { 
            padding: 10px; 
            cursor: pointer; 
            border-bottom: 1px dashed #b3e0ff; 
            transition: background-color 0.2s; }

        .DIV-SIDEBAR li:hover { background-color: #cceeff; }
        .placeholder-text { font-style: italic; color: #666; margin-top: 5px; }
        .DIV-CONTENT { 
            width: 70%; 
            background-color: #ffffff; 
            padding: 5px; 
            overflow-y: auto;
            box-sizing: border-box; }

        #content-display { 
            margin-top: 2px; 
            padding: 1px; 
            border: 1px dashed #999; 
            background-color: #f9f9f9; }
    </style>
</head>
<body onload="loadLayoutParts()"> 

    <div class="SUPER-DIV">
        
        <div class="DIV-HEADER" id="header-container">
            <p>Memuat Header...</p>
        </div>

        <div class="DIV-MAIN">
            
            <div class="DIV-SIDEBAR" id="sidebar-container">
                <p>Memuat Sidebar...</p>
            </div>

            <div class="DIV-CONTENT">
                <h3>CONTENT - DIV-CONTENT (70%)</h3>
                <div id="content-display">
                    <p>Konten yang dipilih dari sidebar akan ditampilkan di sini **secara dinamis**.</p>
                </div>
            </div>

        </div>

        <div class="DIV-FOOTER" id="footer-container">
            <p>Memuat Footer...</p>
        </div>

    </div>

    <script>
        /**
         * FUNGSI UTAMA: Mengambil konten dari URL (nama file) dan memasukkannya ke dalam elemen target.
         */
        function fetchAndLoad(url, targetElementId) {
            const targetDiv = document.getElementById(targetElementId);
            
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`[ERROR ${response.status}] File "${url}" tidak ditemukan.`);
                    }
                    return response.text();
                })
                .then(html => {
                    targetDiv.innerHTML = html;
                })
                .catch(error => {
                    console.error('Error memuat konten:', error);
                    targetDiv.innerHTML = `<p style="color: red;">[LOAD ERROR] Gagal memuat ${url}. ${error.message}</p>`;
                });
        }

        /**
         * FUNGSI 1: Memuat Konten Dinamis (Dipanggil saat list di sidebar diklik)
         * Ini adalah fungsi loadContent() yang digunakan di dalam sidebar_menu.html.
         */
        function loadContent(filename) {
            fetchAndLoad(filename, 'content-display');
        }

        /**
         * FUNGSI 2: Memuat Bagian Layout Statis (Dipanggil saat halaman dibuka)
         * Ini berfungsi seperti PHP include/require di sisi client.
         */
        function loadLayoutParts() {
            // Memuat Header ke dalam DIV-HEADER
            fetchAndLoad('DATA-ALL-FILES/header.html', 'header-container');

            // Memuat List Menu ke dalam DIV-SIDEBAR
            // CATATAN: File sidebar_menu.html harus berisi <ul> dan <li> dengan onclick="loadContent(...)"
            fetchAndLoad('menu.html', 'sidebar-container');

            // Memuat Footer ke dalam DIV-FOOTER
            fetchAndLoad('DATA-ALL-FILES/[FOOTER/index.html', 'footer-container');

            // Opsional: Muat konten default ke DIV-CONTENT saat halaman pertama kali dimuat
            // fetchAndLoad('konten-default.html', 'content-display');
        }
    </script>

</body>
</html>
