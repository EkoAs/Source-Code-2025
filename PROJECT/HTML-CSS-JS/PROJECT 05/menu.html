<!DOCTYPE HTML>
<html lang="id">
    <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Menu</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            box-sizing: border-box;
            
            }
        .SUPER-MAINBOARD-TWO{
            display: flex;
            position: relative;
            flex-wrap: wrap;
            padding: 0;
            margin: 0;
            width: 100%;
            background: transparent;
            border-collapse: collapse;
            border-spacing: 0;
            padding-top: 62px;
            text-align: center;
            justify-content: space-between;
            box-sizing: border-box;
            color: white;
        }


        .SUPER-MAINBOARD-TWO .SUPER-TWO{
            height: max-content;
            width: 100%;
            justify-items: center;
            padding-top: 0px;
            display: flex;
            flex-wrap: wrap;
            box-sizing: border-box;
            border-collapse: 1;
            margin: 0;
            padding-top: 0;
            align-items:center;
            justify-content: center;
           
        }

        .SUPER-MAINBOARD-TWO .SUPER-TWO .main-control{
            width: 220px;
            height: 40px;
            padding: 0;
            background: linear-gradient(135deg, rgba(16, 62, 122, 0.486), rgba(53, 16, 185, 0.493));
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.3); /* biar keliatan glossy */
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); /* efek mengkilap lembut */
            color: white;
            background-image:
            linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 30%),
            linear-gradient(135deg, rgba(29,97,185,0.7), rgba(38,124,96,0.7));
            overflow: hidden; 
            font-size: 19px;
            margin-top: 10px;
            
        }
        .SUPER-MAINBOARD-TWO .SUPER-TWO .main-control::before {
        content: "";
        position: absolute;
        top: 0;
        left: -75%;
        width: 50%;
        height: 100%;
        background: linear-gradient(
            120deg,
            transparent,
            rgba(255, 255, 255, 0.6),
            transparent
        );
        animation: shine 2s infinite;
        }

        @keyframes shine {
        0% { left: -75%; }
        100% { left: 125%; }
        }

        .SUPER-MAINBOARD-TWO .SUPER-TWO .main-control a{
            text-decoration: none;
        }

      
        .main-control li{
            width: 100%;
            height: 100%; 
            list-style: none;
            display: flex;
            align-items: center; 
            justify-content: center; 
                    
        }
</style>
</head>
<body style="margin:0; padding:10px; width:100%;">

   <div class="SUPER-MAINBOARD-TWO">
              <div class="SUPER-TWO">
                <h3>What're you Looking for?</h3><br>
                <button class="main-control"><li onclick="loadContent('DATA-ALL-FILES/home.html')">Home</li></button>
                <button class="main-control"><li onclick="loadContent('DATA-ALL-FILES/COURSES/index.html')">My Skills</li></button>
                <button class="main-control"><li onclick="loadContent('DATA-ALL-FILES/about.html')">About me</li></button>
                <button class="main-control"><li onclick="loadContent('DATA-ALL-FILES/sertifikat.html')">Sertifikasi</li></button>
                <button class="main-control"><li onclick="loadContent('DATA-ALL-FILES/FOLLOW-ME/index.html')">Follow Me On</li></button>
                <button class="main-control"><li onclick="loadContent('DATA-ALL-FILES/FORM/index.html')">Log-in</li></button>
                <button class="main-control"><a href="DATA-ALL-FILES/FORM/index.html" target="_blank">LOGIN</a></button>
              </div>
</div>
    
    
</body>
</html>
