<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Speed Challenge</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2c3e50; color: white; text-align: center; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #34495e; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 90%; max-width: 400px; }
        
        /* Tampilan Menu */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        button { cursor: pointer; border: none; border-radius: 8px; padding: 15px; font-size: 1.1rem; font-weight: bold; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        .btn-mode { background: #3498db; color: white; }
        .btn-mode:hover { background: #2980b9; }
        .btn-campuran { grid-column: span 2; background: #e67e22; }
        
        /* Tampilan Game */
        #game-screen, #game-over-screen { display: none; }
        .score-board { font-size: 1.2rem; margin-bottom: 10px; color: #f1c40f; }
        .timer-bar { width: 100%; height: 10px; background: #444; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        .timer-fill { height: 100%; background: #e74c3c; width: 100%; transition: width linear; }
        
        .question { font-size: 3rem; font-weight: bold; margin: 20px 0; }
        
        /* Input Area */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-option { background: #2ecc71; color: white; font-size: 1.5rem; }
        
        input[type="number"] { width: 80%; padding: 15px; font-size: 1.5rem; text-align: center; border-radius: 8px; border: none; outline: none; }
        
        /* Game Over */
        h1.game-over { color: #e74c3c; }
        .btn-restart { background: #16a085; color: white; width: 100%; margin-top: 20px; }

    </style>
</head>
<body>

    <div class="container">
        <div id="menu-screen">
            <h1>Math Speed ⚡</h1>
            <h6 style="padding:0;margin:0;">Develoment By EkoAsif</h6>
            <p>Pilih Mode Permainan:</p>
            <div class="menu-grid">
                <button class="btn-mode" onclick="startGame('perkalian')">Perkalian (x)</button>
                <button class="btn-mode" onclick="startGame('pembagian')">Pembagian (:)</button>
                <button class="btn-mode" onclick="startGame('penambahan')">Tambah (+)</button>
                <button class="btn-mode" onclick="startGame('pengurangan')">Kurang (-)</button>
                <button class="btn-mode btn-campuran" onclick="startGame('campuran')">Campuran (?)</button>
            </div>
        </div>

        <div id="game-screen">
            <div class="score-board">Skor: <span id="score">0</span></div>
            <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
            
            <div class="question" id="question-text">...</div>
            
            <div id="input-area">
                </div>
        </div>

        <div id="game-over-screen">
            <h1 class="game-over">GAME OVER!</h1>
            <p>Skor Akhir Kamu:</p>
            <h2 style="font-size: 3rem; margin: 10px 0;" id="final-score">0</h2>
            <button class="btn-restart" onclick="location.reload()">Main Lagi</button>
        </div>
    </div>

    <script>
        let currentScore = 0;
        let currentMode = '';
        let currentAnswer = null;
        let timerInterval = null;
        let timeLeft = 0;
        let totalTime = 0;

        function startGame(mode) {
            currentMode = mode;
            currentScore = 0;
            document.getElementById('score').innerText = "0";
            
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            nextQuestion();
        }

        async function nextQuestion() {
            // Request soal baru ke Python
            const response = await fetch('/get_question', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode: currentMode })
            });
            const data = await response.json();

            // Setup Data
            currentAnswer = data.answer;
            document.getElementById('question-text').innerText = data.question;
            
            // Setup Input (Tombol vs Text)
            const inputArea = document.getElementById('input-area');
            inputArea.innerHTML = ''; // Reset area

            if (data.input_type === 'buttons') {
                // Mode Pilihan Ganda
                const grid = document.createElement('div');
                grid.className = 'options-grid';
                data.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-option';
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswer(opt);
                    grid.appendChild(btn);
                });
                inputArea.appendChild(grid);
            } else {
                // Mode Isian Text
                const input = document.createElement('input');
                input.type = 'number';
                input.placeholder = 'Jawab...';
                input.id = 'text-answer';
                input.onkeydown = (e) => {
                    if (e.key === 'Enter') checkAnswer(parseInt(input.value));
                };
                inputArea.appendChild(input);
                input.focus();
            }

            // Reset Timer
            startTimer(data.time_limit);
        }

        function startTimer(seconds) {
            if (timerInterval) clearInterval(timerInterval);
            totalTime = seconds;
            timeLeft = seconds;
            updateTimerBar();

            timerInterval = setInterval(() => {
                timeLeft -= 0.1; // Update tiap 100ms
                updateTimerBar();
                
                if (timeLeft <= 0) {
                    gameOver();
                }
            }, 100);
        }

        function updateTimerBar() {
            const percentage = (timeLeft / totalTime) * 100;
            document.getElementById('timer-fill').style.width = percentage + '%';
        }

        function checkAnswer(userVal) {
            if (userVal === currentAnswer) {
                // BENAR
                currentScore += 10;
                document.getElementById('score').innerText = currentScore;
                clearInterval(timerInterval);
                nextQuestion();
            } else {
                // SALAH
                gameOver();
            }
        }

        function gameOver() {
            clearInterval(timerInterval);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'block';
            document.getElementById('final-score').innerText = currentScore;
        }
    </script>
</body>
</html>
