<!DOCTYPE html>
<html lang="id-en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Luxury Edition</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<!-- ========================SUPER MAIN========================================== -->
    <div class="main-container">
        
        <div id="menu-screen">
            <h1 class="luxury-title">MATH ELITE</h1>
            <p class="subtitle">Select Your Challenge</p>
            
            <div class="menu-grid">
                <button class="btn-luxury" onclick="game.start('perkalian')">
                    <span class="icon">✖</span> Perkalian (Speed)
                </button>
                <button class="btn-luxury" onclick="game.start('penambahan')">
                    <span class="icon">✚</span> Penambahan
                </button>
                <button class="btn-luxury" onclick="game.start('pengurangan')">
                    <span class="icon">➖</span> Pengurangan
                </button>
                <button class="btn-luxury btn-gold" onclick="game.start('campuran')">
                    <span class="icon">★</span> Campuran Expert
                </button>
            </div>
        </div>

        <div id="game-screen" class="hidden">
            <div class="game-header">
                <div class="score-box">SCORE: <span id="score">0</span></div>
                <div class="timer-container">
                    <div id="timer-bar"></div>
                </div>
            </div>

            <div class="question-area">
                <h2 id="question-text">Loading...</h2>
            </div>

            <div id="input-area"></div>
        </div>

        <div id="game-over-screen" class="hidden">
            <h1 class="game-over-text">GAME OVER</h1>
            <p>Final Score</p>
            <h2 id="final-score">0</h2>
            <button class="btn-luxury" onclick="location.reload()">Try Again</button>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>

</body>
</html>
