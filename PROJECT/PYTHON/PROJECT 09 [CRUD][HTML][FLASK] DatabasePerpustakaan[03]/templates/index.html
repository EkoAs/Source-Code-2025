<!DOCTYPE html>
<html>
<head>
    <title>Perpustakaan Executive</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Database Perpustakaan</h1>
        
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="/tambah" class="btn btn-tambah">+ Tambah Koleksi</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th width="5%">No</th>
                    <th>Judul Buku</th>
                    <th>Penulis</th>
                    <th width="10%">Tahun</th>
                    <th width="20%">Aksi</th>
                </tr>
            </thead>
            <tbody>
                {% for buku in data %}
                <tr>
                    <td style="text-align: center;">{{ loop.index }}</td>
                    <td>{{ buku.judul }}</td>
                    <td>{{ buku.penulis }}</td>
                    <td style="text-align: center;">{{ buku.tahun }}</td>
                    <td style="text-align: center;">
                        <a href="/edit/{{ buku.pk }}" class="btn btn-edit">Edit</a>
                        <a href="/hapus/{{ buku.pk }}" class="btn btn-hapus" onclick="return confirm('Hapus data ini?')">Hapus</a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5">Belum ada data buku. Silakan tambah data baru.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
